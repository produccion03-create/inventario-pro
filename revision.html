<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisión de stock | Inventario Pro</title>
<link rel="stylesheet" href="CSS/style.css">
<style>
.revision-card{background:#fff;padding:24px;border-radius:12px;max-width:850px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.revision-card select,.revision-card input{padding:10px;border:1px solid #ccc;border-radius:7px;font-size:16px}
.ficha{margin-top:20px;padding:20px;background:#f7f8fa;border-radius:10px}
.fila{margin:8px 0}
.stock-grande{font-size:28px;font-weight:700}
.acciones{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acciones button{padding:10px 16px;border:0;border-radius:7px;cursor:pointer}
#panelPendientes{margin-top:18px;padding:15px;background:#f7f8fa;border-radius:8px}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">📦 Inventario Pro</div>
<nav>
<a href="index.html">🏠 Inicio</a>
<a href="productos.html">📦 Productos</a>
<a href="scanner.html">📷 Escáner</a>
<a href="entrada.html">📥 Entrada</a>
<a href="salida.html">📤 Salida</a>
<a href="movimientos.html">📊 Movimientos</a>
<a href="informes.html">📈 Informes</a>
<a href="revision.html">🔎 Revisión de stock</a>
<a href="configuracion.html">⚙️ Configuración</a>
</nav>
</aside>
<main class="contenido">
<h1>Revisión de stock</h1>
<div class="revision-card">
<label for="categoria"><strong>Familia</strong></label><br>
<select id="categoria">
<option value="">Cargando familias...</option>
</select>
<p id="contadorRevision">Cargando inventario...</p>

<div id="panelRevision" hidden>
<div class="ficha">
<h2 id="nombreProducto"></h2>
<div class="fila"><strong>Código:</strong> <span id="codigoProducto"></span></div>
<div class="fila"><strong>Subfamilia / Material:</strong> <span id="materialProducto"></span></div>
<div class="fila"><strong>Descripción:</strong> <span id="descripcionProducto"></span></div>
<div class="fila"><strong>Formato:</strong> <span id="formatoProducto"></span></div>
<div class="fila"><strong>Proveedor:</strong> <span id="proveedorProducto"></span></div>
<div class="fila"><strong>Stock sistema:</strong> <span class="stock-grande" id="stockSistema"></span></div>
<div class="fila">
<label for="stockFisico"><strong>Stock físico:</strong></label><br>
<input id="stockFisico" type="number" step="any" inputmode="decimal">
</div>
<div class="fila" style="margin-top:14px">
<label><input id="marcarRevisado" type="checkbox"> Marcar como revisado</label>
</div>
<div class="acciones">
<button id="anteriorProducto">← Anterior</button>
<button id="siguienteProducto">Siguiente →</button>
</div>
</div>
<div id="panelPendientes"></div>
</div>
</div>
</main>
</div>
<script type="module" src="JS/revision.js"></script>
</body>
</html>
