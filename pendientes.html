<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pendientes</title>

<link rel="stylesheet" href="CSS/style.css">

</head>

<body>

<div class="app">

<h1>📋 Productos pendientes</h1>

<div class="panel">

<h2>🔍 Buscar</h2>

<input
type="text"
id="buscar"
placeholder="Buscar por nombre o código...">

</div>

<br>

<div class="dashboard">

<div class="card card-stock">

<h3>🟠 Stock bajo</h3>

<span id="contadorBajo">0</span>

<p>Productos</p>

</div>

<div class="card card-alerta">

<h3>🔴 Sin stock</h3>

<span id="contadorSinStock">0</span>

<p>Productos</p>

</div>

</div>

<br>

<div id="listaPendientes">

Cargando...

</div>

<br>

<button onclick="location.href='index.html'">

⬅ Volver

</button>

</div>

<script type="module" src="JS/pendientes.js"></script>

</body>

</html>
