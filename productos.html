<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="CSS/style.css">

</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            📦 Inventario Pro

        </div>

        <nav>

            <a href="index.html">🏠 Dashboard</a>

            <a href="productos.html" class="activo">📦 Productos</a>

            <a href="scanner.html">📷 Escáner</a>

            <a href="entrada.html">➕ Entrada</a>

            <a href="salida.html">➖ Salida</a>

            <a href="movimientos.html">📋 Movimientos</a>

            <a href="informes.html">📊 Informes</a>

            <a href="configuracion.html">⚙ Configuración</a>

            <a href="revision.html"> 🔎 Revisión de stock

            </a>

        </nav>

    </aside>

    <!-- CONTENIDO -->

    <main class="contenido">

        <header class="topbar">

            <div>

                <h1>Productos</h1>

                <p>Gestión del inventario</p>

            </div>

        </header>

        <div class="app">

            <!-- NUEVO PRODUCTO -->

            <div class="panel">

                <h2>➕ Nuevo producto</h2>

                <div class="grid-form">

                    <input
                    id="codigo"
                    placeholder="Código de barras">

                    <input
                    id="nombre"
                    placeholder="Nombre del producto">

                    <select id="categoria">

                        <option value="">
                            Seleccionar categoría
                        </option>

                        <option value="Stock de productos terminados">
                            Stock de productos terminados
                        </option>

                        <option value="Stock de planchas">
                            Stock de planchas
                        </option>

                        <option value="Materias primas auxiliares">
                            Materias primas auxiliares
                        </option>

                        <option value="Envases y embalaje">
                            Envases y embalaje
                        </option>

                    </select>

                    <input
                    id="stock"
                    type="number"
                    placeholder="Stock">

                    <input
                    id="precio"
                    type="number"
                    step="0.01"
                    placeholder="Precio">

                    <input
                    id="stockMinimo"
                    type="number"
                    value="5"
                    placeholder="Stock mínimo">

                    <input
                    id="proveedor"
                    placeholder="Proveedor / Ubicación">

                    <input
                    id="formato"
                    placeholder="Formato">

                </div>

                <br>

                <button onclick="guardarProducto()">

                    💾 Guardar producto

                </button>

            </div>

            <!-- LISTA -->

            <div class="panel">

                <div class="cabecera-tabla">

                    <h2>📋 Productos</h2>

                    <input
                    type="text"
                    id="buscar"
                    placeholder="🔍 Buscar producto...">

                </div>

                <div id="lista">

                </div>

            </div>

        </div>

    </main>

</div>

<!-- MODAL -->

<div id="modalEditar" class="modal">

    <div class="modal-contenido">

        <h2>✏️ Editar producto</h2>

        <input
        type="hidden"
        id="editarId">

        <input
        id="editarCodigo"
        placeholder="Código">

        <br><br>

        <input
        id="editarNombre"
        placeholder="Nombre">

        <br><br>

        <select id="editarCategoria">

            <option value="Stock de productos terminados">
                Stock de productos terminados
            </option>

            <option value="Stock de planchas">
                Stock de planchas
            </option>

            <option value="Materias primas auxiliares">
                Materias primas auxiliares
            </option>

            <option value="Envases y embalaje">
                Envases y embalaje
            </option>

        </select>

        <br><br>

        <input
        id="editarStock"
        type="number"
        placeholder="Stock">

        <br><br>

        <input
        id="editarPrecio"
        type="number"
        step="0.01"
        placeholder="Precio">

        <br><br>

        <input
        id="editarStockMinimo"
        type="number"
        placeholder="Stock mínimo">

        <br><br>

        <input
        id="editarProveedor"
        placeholder="Proveedor / Ubicación">

        <br><br>

        <input
        id="editarFormato"
        placeholder="Formato">

        <br><br>

        <button onclick="guardarEdicion()">

            💾 Guardar cambios

        </button>

        <button onclick="cerrarModal()">

            ❌ Cancelar

        </button>

    </div>

</div>

<script type="module" src="JS/productos.js?v=proveedor-formato-v3"></script>

</body>

</html>
