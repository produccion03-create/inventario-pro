<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productos</title>

<link rel="stylesheet" href="CSS/style.css">

</head>

<body>

<div class="app">

<h1>📦 Productos</h1>

<input
id="codigo"
placeholder="Código de barras">

<br><br>

<input
id="nombre"
placeholder="Nombre producto">

<br><br>

<select id="categoria">

<option value="">
Seleccionar categoría
</option>

<option value="Producto terminado">
Producto terminado
</option>

<option value="Planchas de EVA">
Planchas de EVA
</option>

<option value="Materias primas auxiliares">
Materias primas auxiliares
</option>

<option value="Stock envases embalajes">
Stock envases embalajes
</option>

</select>

<br><br>

<input
id="stock"
type="number"
placeholder="Stock">

<br><br>

<input
id="precio"
type="number"
step="0.01"
placeholder="Precio">

<br><br>

<input
id="stockMinimo"
type="number"
value="5"
placeholder="Stock mínimo">

<br><br>

<button onclick="guardarProducto()">

💾 Guardar producto

</button>

<hr>

<h2>📋 Lista de productos</h2>

<input
type="text"
id="buscar"
placeholder="🔍 Buscar por nombre, código o categoría...">

<br><br>

<div id="lista"></div>

<!-- MODAL EDITAR -->

<div id="modalEditar" class="modal">

<div class="modal-contenido">

<h2>✏️ Editar producto</h2>

<input
type="hidden"
id="editarId">

<input
id="editarCodigo"
placeholder="Código">

<br><br>

<input
id="editarNombre"
placeholder="Nombre">

<br><br>

<select id="editarCategoria">

<option value="Producto terminado">
Producto terminado
</option>

<option value="Planchas de EVA">
Planchas de EVA
</option>

<option value="Materias primas auxiliares">
Materias primas auxiliares
</option>

<option value="Stock envases embalajes">
Stock envases embalajes
</option>

</select>

<br><br>

<input
id="editarStock"
type="number"
placeholder="Stock">

<br><br>

<input
id="editarPrecio"
type="number"
step="0.01"
placeholder="Precio">

<br><br>

<input
id="editarStockMinimo"
type="number"
placeholder="Stock mínimo">

<br><br>

<button onclick="guardarEdicion()">

💾 Guardar cambios

</button>

<button onclick="cerrarModal()">

❌ Cancelar

</button>

</div>

</div>

<br>

<button onclick="location.href='index.html'">

⬅ Volver

</button>

</div>

<script type="module" src="JS/productos.js"></script>

</body>

</html>
